const pages=['Dashboard','Customers','Vehicles','Policies','Renewals','Agents','Staff','Commissions'],icons=['◫','♙','▱','▤','↻','♧','▦','◈'];let page='Dashboard',role='Admin',query='',step=0;const seed=[{id:'POL-2026-0841',name:'Michelle Tan',plate:'VKL 8821',car:'Honda HR-V',insurer:'Allianz',premium:1840,end:'2026-11-05',agent:'Jason Wong',status:'Active'},{id:'POL-2026-0840',name:'Ahmad Farid',plate:'BQU 3256',car:'Proton X50',insurer:'Etiqa',premium:1520,end:'2026-11-12',agent:'Sarah Lee',status:'Active'},{id:'POL-2026-0839',name:'David Chen',plate:'WXY 6918',car:'Toyota Vios',insurer:'Tokio Marine',premium:1280,end:'2026-11-18',agent:'Jason Wong',status:'Active'},{id:'POL-2026-0838',name:'Nur Aisyah',plate:'VBN 2048',car:'Perodua Myvi',insurer:'Zurich',premium:960,end:'2027-03-21',agent:'Sarah Lee',status:'Active'},{id:'POL-2026-0837',name:'Raj Kumar',plate:'BPT 7789',car:'Mazda CX-5',insurer:'Allianz',premium:2380,end:'2026-10-25',agent:'Jason Wong',status:'Expired'},{id:'POL-2026-0836',name:'Emily Low',plate:'VGT 1688',car:'BMW 320i',insurer:'Etiqa',premium:3200,end:'2027-08-14',agent:'Jason Wong',status:'Active'}];let policies;try{policies=JSON.parse(localStorage.getItem('bbt-demo-policies'))||seed}catch(e){policies=seed}const money=n=>'RM '+Number(n).toLocaleString('en-MY',{minimumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let scoped=()=>policies.filter(p=>role!=='Agent'||p.agent==='Jason Wong');function toast(s){document.getElementById('toastRoot').innerHTML='<div class="toast">✓ '+esc(s)+'</div>';setTimeout(()=>document.getElementById('toastRoot').innerHTML='',3500)}function go(p){page=p;query='';render();document.querySelector('aside').classList.remove('open')}function nav(){document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button class="nav ${page===p?'active':''}" onclick="go('${p}')"><span>${icons[i]}</span><span>${p}</span>${p==='Renewals'?'<span style="margin-left:auto;font-size:12px">3</span>':''}</button>`).join('')}function render(){nav();document.getElementById('crumb').textContent=page;let names={Superadmin:['Owner','System owner','SA'],Admin:['Alex Lim','Administrator','AL'],Staff:['Chloe Tan','Policy operations','CT'],Agent:['Jason Wong','Insurance agent','JW']};document.getElementById('username').textContent=names[role][0];document.getElementById('rolename').textContent=names[role][1];document.getElementById('avatar').textContent=names[role][2];let desc={Dashboard:'Here’s what’s happening at your agency today.',Customers:'每一位客户，每一份信任。管理您的客户关系。',Vehicles:'客户车辆档案与关联保单，一目了然。',Policies:'集中管理保单 · Staff 可直接保存，无需审核。',Renewals:'及时跟进即将到期的保单，让保障持续。',Agents:'管理代理团队、业务表现及所属客户。',Staff:'管理内部员工与保单操作权限。',Commissions:'透明追踪每一笔佣金与结算。'};document.getElementById('content').innerHTML=`<div class="heading"><div><div class="eyebrow">${page==='Dashboard'?'YOUR AGENCY AT A GLANCE':'BBT WORKSPACE / '+role.toUpperCase()}</div><h1>${page==='Dashboard'?'Good morning, '+names[role][0].split(' ')[0]+' ☀':page}</h1><p class="sub">${desc[page]}</p></div><div class="actions"><button class="btn" onclick="exportCSV()">↓ Export</button>${role!=='Agent'?'<button class="btn primary" onclick="openUpload()">＋ Upload policy</button>':''}</div></div>${role==='Agent'?'<div class="banner">Agent 视图 · 当前仅显示 Jason Wong 名下客户、车辆、保单与佣金。团队管理仅 Admin 可操作。</div>':''}${page==='Dashboard'?dashboard():listPage()}<div class="footer"><span>© 2026 BBT Agency · Auto Insurance CRM V1.0</span><span>◌ All data is simulated · 仅限演示</span></div>`}function dashboard(){let data=scoped().filter(p=>!p.replacedBy),total=data.reduce((s,p)=>s+p.premium,0);return `<div class="stats">${[['Total premium',money(total),'↗','12.8%','vs. last month'],['Active policies',data.filter(p=>p.status==='Active').length,'▤','8.2%','vs. last month'],['Renewals due',data.filter(p=>p.end<='2026-11-28'&&p.status==='Active').length,'↻','Next 30 days','needs your attention'],['Total customers',new function customerPolicies(id){const c=visibleCustomer(id);if(!c)return;modal(`<div class="card-head"><h2>${esc(c.name)} · Policies</h2><button class="link" onclick="closeModal()">✕ Close</button></div>${policyTable(scoped().filter(p=>p.customerId===id))}<button class="btn" style="margin-top:20px" onclick="customerDetail('${id}')">Back to profile</button>`)}
function customerForm(id){if(role==='Agent')return;const c=customers.find(c=>c.id===id)||{name:'',ic:'',phone:'',email:'',address:'',ownerId:role==='Staff'?accounts.staff[0]?.id:role==='Superadmin'?accounts.superadmin.id:accounts.admins[0]?.id};modal(`<div class="card-head"><h2>${id?'Edit customer':'Add customer'}</h2><button class="link" onclick="closeModal()">✕ Close</button></div><p class="sub">Use fictional details only in this demo. IC is unique across all customers.</p><form onsubmit="saveCustomer(event,'${id||''}')"><div class="fields">${[['name','Customer name'],['ic','IC number (unique)'],['phone','Contact number'],['email','Email'],['address','Address']].map(([k,l])=>`<label>${l}<input name="${k}" type="${k==='email'?'email':'text'}" value="${esc(c[k])}" maxlength="${k==='address'?200:80}" ${k==='address'?'':'required'}></label>`).join('')}<label>Assigned account<select name="ownerId" required>${allOwners().map(a=>`<option value="${esc(a.id)}" ${a.id===c.ownerId?'selected':''}>${esc(a.role)} · ${esc(a.id)} · ${esc(a.name)}</option>`).join('')}</select></label></div><div class="modal-foot"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save customer</button></div></form>`)}
const normalizeIC=ic=>ic.replace(/[\s-]/g,'').toUpperCase();
function saveCustomer(e,id){e.preventDefault();if(role==='Agent')return;const data=Object.fromEntries(new FormData(e.target));Object.keys(data).forEach(k=>data[k]=data[k].trim());if(!data.name||!data.ic||!data.phone||!data.email)return;if(!allOwners().some(a=>a.id===data.ownerId)){toast('Choose an existing assigned account');return}if(customers.some(c=>c.id!==id&&normalizeIC(c.ic)===normalizeIC(data.ic))){toast('IC number already exists. Use the existing customer profile.');return}data.ic=data.ic.toUpperCase();if(id){let i=customers.findIndex(c=>c.id===id);if(i<0)return;customers[i]={...customers[i],...data}}else{data.id='CUS-'+crypto.randomUUID();customers.push(data)}for(const p of policies.filter(p=>p.customerId===(id||data.id))){p.name=data.name}persistCustomers();closeModal();render();toast('Customer profile saved')}
editForm=function(){if(role==='Agent')return;accountEdit();const form=document.getElementById('policyForm');const name=form.elements.name;const currentName=name.value;name.closest('label').innerHTML=`Customer<select name="customerId" required>${customers.map(c=>`<option value="${c.id}" ${c.name===currentName?'selected':''}>${esc(c.name)} · ${esc(c.ic)}</option>`).join('')}</select><input type="hidden" name="name" value="${esc(currentName)}">`;const agent=form.elements.agent;agent.closest('label').innerHTML='<span>Customer ownership</span><p class="sub" style="margin-top:10px">Uses the assigned account on the customer profile.</p>';form.insertAdjacentHTML('afterbegin','<div class="banner">Choose an existing customer. Multiple vehicles can share the same customer profile. Create a new customer under Customers first.</div>')};
savePolicy=function(e){e.preventDefault();if(role==='Agent')return;const c=customers.find(c=>c.id===e.target.elements.customerId.value);if(!c){toast('Create a customer profile first');return}e.target.elements.name.value=c.name;const before=policies.length;originalSave(e);if(policies.length>before){policies[0].customerId=c.id;const a=ownerOf(c);policies[0].agent=a?.name||'';policies[0].agentId=a?.role==='Agent'?a.id:null;persist();render()}};
const previousConfirmDelete=confirmDeleteStaff,previousSaveAccount=saveAccount;
confirmDeleteStaff=function(id){if(customers.some(c=>c.ownerId===id)){toast('Reassign this staff member’s customers before deleting the account.');return}previousConfirmDelete(id)};
saveAccount=function(e,kind,id){const old=accounts[kind]?.find(a=>a.id===id);const previousId=old?.id;previousSaveAccount(e,kind,id);if(previousId&&old!==accounts[kind]?.find(a=>a.id===previousId)){const next=Object.fromEntries(new FormData(e.target)).id.trim().toUpperCase();if(accounts[kind].some(a=>a.id===next)){customers.filter(c=>c.ownerId===previousId).forEach(c=>c.ownerId=next);persistCustomers()}}};
render();

</script><script>
// In-app reminders only. No email, WhatsApp, push delivery or background service.
function malaysiaToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function dayNumber(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return NaN;const [y,m,d]=date.split('-').map(Number);const stamp=Date.UTC(y,m-1,d);return new Date(stamp).toISOString().slice(0,10)===date?stamp/86400000:NaN}
function dateBefore(date,days){const n=dayNumber(date);return Number.isFinite(n)?new Date((n-days)*86400000).toISOString().slice(0,10):'—'}
function renewalBucket(days){return days<0?'overdue':days<=7?'7':days<=30?'30':days<=60?'60':'later'}
let renewalAsOf=malaysiaToday(),renewalFilter='all',renewalOwner='all';
function sameVehicle(a,b){return a.customerId===b.customerId&&a.plate.replace(/\s/g,'').toUpperCase()===b.plate.replace(/\s/g,'').toUpperCase()}
function alreadyRenewed(p){return policies.some(next=>next.id!==p.id&&sameVehicle(next,p)&&dayNumber(next.end)>dayNumber(p.end)&&Number.isFinite(dayNumber(next.start))&&dayNumber(next.start)<=dayNumber(p.end)+1)}
function reminderRecords(){return scoped().filter(p=>!alreadyRenewed(p)&&Number.isFinite(dayNumber(p.end))).map(p=>{const c=customers.find(c=>c.id===p.customerId);return {p,c,owner:c?ownerOf(c):null,days:dayNumber(p.end)-dayNumber(renewalAsOf)}}).filter(r=>r.days<=60).sort((a,b)=>a.days-b.days)}
function ownAccountId(){return role==='Agent'?activeAgentId:role==='Superadmin'?accounts.superadmin.id:accounts[role==='Admin'?'admins':'staff'][0]?.id}
function visibleReminders(){return reminderRecords().filter(r=>renewalOwner!=='mine'||r.c?.ownerId===ownAccountId())}
function reminderPill(r){return `<span class="pill ${r.days<0?'red':r.days<=7?'red':'amber'}">${r.days<0?Math.abs(r.days)+' days overdue':r.days===0?'Expires today':r.days+' days left'}</span>`}
const renewalList=listPage,renewalRows=rowsHTML,renewalRender=render,renewalNav=nav;
allowedPages=function(){return role==='Agent'?['Customers','Policies','Renewals']:pages.filter(p=>role==='Superadmin'||p!=='Accounts'&&(role!=='Staff'||p!=='Staff'))};
nav=function(){renewalNav();const b=[...document.querySelectorAll('#nav button')].find(b=>b.textContent.includes('Renewals'));if(b)b.insertAdjacentHTML('beforeend',`<span class="pill" style="margin-left:auto;padding:2px 6px">${reminderRecords().length}</span>`)};
function setRenewalView(key,value){if(key==='date'){if(!Number.isFinite(dayNumber(value)))return;renewalAsOf=value}else if(key==='bucket')renewalFilter=value;else renewalOwner=value;query='';render()}
function renewalCards(){const r=visibleReminders();return `<div class="stats">${[['60','31–60 days','Plan ahead'],['30','8–30 days','Contact customer'],['7','0–7 days','Urgent follow-up'],['overdue','Expired','Review coverage']].map(([k,label,note])=>`<button class="card" style="text-align:left;${renewalFilter===k?'border-color:var(--green);box-shadow:0 0 0 1px var(--green)':''}" onclick="setRenewalView('bucket','${k}')"><div class="stat-top">${label}</div><div class="number">${r.filter(r=>renewalBucket(r.days)===k).length}</div><p class="sub">${note}</p></button>`).join('')}</div>`}
listPage=function(){if(page!=='Renewals')return renewalList();return `<div class="banner">In-app renewal reminders at <b>60, 30 and 7 days before expiry</b> · Dates use Malaysia time. Agents see only their assigned customers. No automatic messages are sent.</div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px"><label>As of <input class="search" type="date" aria-label="Reminder date" value="${renewalAsOf}" onchange="setRenewalView('date',this.value)"></label><button class="btn" onclick="setRenewalView('date',malaysiaToday())">Today</button>${role!=='Agent'?`<select class="role" aria-label="Reminder ownership" onchange="setRenewalView('owner',this.value)"><option value="all" ${renewalOwner==='all'?'selected':''}>All agency customers</option><option value="mine" ${renewalOwner==='mine'?'selected':''}>My own customers</option></select>`:''}</div>${renewalCards()}<div class="card table-card"><div class="table-top"><div><h2>Renewal reminders</h2><div class="card-note">${role==='Agent'?'My customers':'Agency reminders'} · Upcoming reminders appear in one urgency group</div></div><select class="role" aria-label="Reminder group" onchange="setRenewalView('bucket',this.value)">${[['all','All reminders'],['60','31–60 days'],['30','8–30 days'],['7','0–7 days'],['overdue','Expired']].map(([k,n])=>`<option value="${k}" ${renewalFilter===k?'selected':''}>${n}</option>`).join('')}</select><input class="search" aria-label="搜索记录" placeholder="Search customer, vehicle or owner…" oninput="query=this.value;updateRows()"></div><div id="rows">${rowsHTML()}</div></div><p class="permission">Each policy shows its three reminder dates. Already renewed policies are excluded when linked replacement coverage is recorded. This demo calculates reminders when you open it; it does not run a background scheduler.</p>`};
rowsHTML=function(){if(page!=='Renewals')return renewalRows();let r=visibleReminders().filter(r=>renewalFilter==='all'||renewalBucket(r.days)===renewalFilter).filter(r=>[r.p.id,r.c?.name,r.p.plate,r.owner?.name,r.c?.ownerId].join(' ').toLowerCase().includes(query.toLowerCase()));return table(['Customer / vehicle','Assigned to','Expiry / remaining','60-day reminder','30-day reminder','7-day reminder','Follow-up',''],r.map(r=>{const p=r.p;return [`<b>${esc(r.c?.name||p.name)}</b><small>${esc(p.plate)} · ${esc(p.car)}</small>`,`<b>${esc(r.owner?.name||'Unassigned')}</b><small>${esc(r.owner?.role||'')} · ${esc(r.c?.ownerId||'')}</small>`,`${esc(p.end)}<small>${reminderPill(r)}</small>`,... [60,30,7].map(n=>`<span style="${dateBefore(p.end,n)<=renewalAsOf?'color:var(--green);font-weight:600':''}">${dateBefore(p.end,n)}</span>`),role==='Agent'?`<span class="pill">${p.followed?'Contacted':'To follow up'}</span>`:`<button class="btn" onclick="follow('${p.id}')">${p.followed?'✓ Contacted':'Mark contacted'}</button>`,`<button class="link" onclick="detail('${p.id}')">View policy ↗</button>`]}))};
render=function(){renewalRender();let bell=document.getElementById('renewalBell');if(!bell){bell=document.createElement('button');bell.id='renewalBell';bell.className='btn';document.getElementById('role').before(bell);bell.onclick=()=>{renewalFilter='all';renewalOwner='all';go('Renewals')}}bell.textContent='↻ '+reminderRecords().length;bell.setAttribute('aria-label','Open renewal reminders');if(page==='Renewals'){document.querySelector('.heading h1').textContent='Renewal reminders';document.querySelector('.heading .sub').textContent='60 / 30 / 7-day reminders · '+renewalAsOf;document.querySelector('.heading .actions').innerHTML=''}if(page==='Dashboard'){const all=reminderRecords(),upcoming=all.filter(r=>r.days>=0);const count=document.querySelectorAll('.stats .number')[2];if(count){count.textContent=upcoming.length;count.nextElementSibling.innerHTML='<b>Next 60 days</b> reminders at 60 / 30 / 7 days'}const card=document.querySelector('.grid > .card:last-child');if(card)card.innerHTML=`<div class="card-head"><div><h2>Upcoming renewals</h2><div class="card-note">Reminders at 60, 30 and 7 days before expiry</div></div><button class="link" onclick="go('Renewals')">View all ↗</button></div>${upcoming.slice(0,3).map(r=>`<div class="renew-item"><div class="car-icon">▱</div><div><div class="renew-name">${esc(r.c?.name||r.p.name)}</div><div class="renew-detail">${esc(r.p.plate)} · ${esc(r.p.car)}</div></div>${reminderPill(r)}</div>`).join('')||'<p class="sub" style="padding:24px 0">No policies due in the next 60 days.</p>'}<button class="btn" style="width:100%;justify-content:center;margin-top:12px" onclick="go('Renewals')">Manage reminders →</button>`}};
document.getElementById('role').onchange=e=>{role=e.target.value;renewalFilter='all';renewalOwner='all';query='';closeModal();render()};
render();

</script><script>
// Renewals replace the current vehicle policy while retaining the prior period.
let renewalPolicyId='',showPolicyHistory=false;
const uploadReview=editForm,renewalTable=policyTable,renewalDetails=detail,renewalPageRows=rowsHTML,renewalPageRender=render;
const normalizePlate=plate=>plate.replace(/[\s-]/g,'').toUpperCase();
function latestVehiclePolicy(customerId,plate){return policies.filter(p=>p.customerId===customerId&&normalizePlate(p.plate)===normalizePlate(plate)&&!p.replacedBy).sort((a,b)=>b.end.localeCompare(a.end))[0]}
function renewalUpload(id){if(role==='Agent')return;const p=scoped().find(p=>p.id===id&&!p.replacedBy);if(!p)return;renewalPolicyId=id;openUpload()}
function applyRenewalSelection(){const f=document.getElementById('policyForm');if(!f)return;const renewal=f.elements.policyType.value==='renewal';f.elements.previousPolicyId.closest('label').hidden=!renewal;if(!renewal)return;const p=scoped().find(p=>p.id===f.elements.previousPolicyId.value&&!p.replacedBy);if(!p)return;f.elements.customerId.value=p.customerId;f.elements.plate.value=p.plate;f.elements.car.value=p.car;f.elements.start.value=dateBefore(p.end,-1);const end=new Date(f.elements.start.value+'T00:00:00Z');end.setUTCFullYear(end.getUTCFullYear()+1);end.setUTCDate(end.getUTCDate()-1);f.elements.end.value=end.toISOString().slice(0,10);document.getElementById('replacementInfo').textContent='Replaces '+p.id+' · previous expiry '+p.end+'. The previous policy stays in history; reminders will use the new expiry.'}
editForm=function(){if(role==='Agent')return;uploadReview();const f=document.getElementById('policyForm');const candidates=scoped().filter(p=>!p.replacedBy);const chosen=candidates.find(p=>p.id===renewalPolicyId);f.querySelector('.fields').insertAdjacentHTML('afterbegin',`<label>Policy type<select name="policyType" onchange="applyRenewalSelection()"><option value="new">New vehicle policy</option><option value="renewal" ${chosen?'selected':''}>Renew existing vehicle policy</option></select></label><label ${chosen?'':'hidden'}>Previous policy<select name="previousPolicyId" onchange="applyRenewalSelection()">${candidates.map(p=>`<option value="${esc(p.id)}" ${p.id===chosen?.id?'selected':''}>${esc(p.plate)} · ${esc(p.name)} · ${esc(p.end)}</option>`).join('')}</select></label>`);f.insertAdjacentHTML('afterbegin','<div class="banner" id="replacementInfo">For an existing vehicle, choose Renew existing vehicle policy. Check the extracted dates and premium before saving.</div>');if(chosen)applyRenewalSelection();renewalPolicyId=''};
function validateRenewal(data,previous){if(!Number.isFinite(dayNumber(data.start))||!Number.isFinite(dayNumber(data.end))||data.end<=data.start)return 'Expiry must be later than the coverage start.';if(previous){if(previous.replacedBy)return 'This policy has already been renewed. Select the latest policy.';if(data.customerId!==previous.customerId||normalizePlate(data.plate)!==normalizePlate(previous.plate))return 'Renewal must match the previous customer and vehicle.';if(data.start<=previous.end)return 'New coverage must start after the previous expiry to avoid overlapping periods.';if(data.end<=previous.end)return 'Renewal expiry must be later than the previous expiry.'}return ''}
savePolicy=function(e){e.preventDefault();if(role==='Agent')return;const d=Object.fromEntries(new FormData(e.target));const c=customers.find(c=>c.id===d.customerId);if(!c){toast('Choose an existing customer');return}d.plate=d.plate.trim().toUpperCase();d.car=d.car.trim();d.premium=Number(d.premium);if(!d.plate||!d.car||!Number.isFinite(d.premium)||d.premium<=0){toast('Enter valid vehicle details and premium');return}const previous=d.policyType==='renewal'?scoped().find(p=>p.id===d.previousPolicyId):null;if(d.policyType==='renewal'&&!previous){toast('Select a previous policy to renew');return}const error=validateRenewal(d,previous);if(error){toast(error);return}const existing=policies.find(p=>normalizePlate(p.plate)===normalizePlate(d.plate)&&!p.replacedBy);if(existing&&existing.id!==previous?.id){toast('Vehicle already has a policy. Select its latest policy under Renew existing vehicle policy.');return}const a=ownerOf(c);const p={id:'POL-'+crypto.randomUUID().slice(0,8).toUpperCase(),customerId:c.id,name:c.name,plate:d.plate,car:d.car,insurer:d.insurer,premium:d.premium,start:d.start,end:d.end,status:'Active',agent:a?.name||'',agentId:a?.role==='Agent'?a.id:null,createdBy:ownAccountId(),createdAt:new Date().toISOString()};if(previous){p.renewsPolicyId=previous.id;p.coverageGapDays=dayNumber(p.start)-dayNumber(previous.end)-1;previous.replacedBy=p.id;previous.status='Renewed'}policies.unshift(p);persist();closeModal();showPolicyHistory=false;renewalFilter='all';go('Policies');toast(previous?'Renewal saved. New insurance period is current; previous policy retained in history.':'Policy saved directly without Admin approval')};
policyTable=function(data){const selected=showPolicyHistory?data:data.filter(p=>!p.replacedBy);return table(['Policy / customer','Vehicle','Insurer','Premium','Insurance period','Status',''],selected.map(p=>[`<b>${esc(p.id)}</b><small>${esc(p.name)}</small>`,`<b>${esc(p.plate)}</b><small>${esc(p.car)}</small>`,esc(p.insurer),money(p.premium),`${esc(p.start||'Not recorded')} → ${esc(p.end)}`,`<span class="pill ${p.replacedBy?'amber':''}">${p.replacedBy?'Previous period':p.start>malaysiaToday()?'Upcoming':p.end<malaysiaToday()?'Expired':'Active'}</span>`,`<button class="link" onclick="detail('${p.id}')">View ↗</button>`]))};
alreadyRenewed=function(p){return Boolean(p.replacedBy)};
function togglePolicyHistory(){showPolicyHistory=!showPolicyHistory;render()}
function policyHistory(id){const p=scoped().find(p=>p.id===id);if(!p)return;const history=scoped().filter(v=>v.customerId===p.customerId&&normalizePlate(v.plate)===normalizePlate(p.plate)).sort((a,b)=>b.end.localeCompare(a.end));modal(`<div class="card-head"><h2>${esc(p.plate)} · Insurance history</h2><button class="link" onclick="closeModal()">✕ Close</button></div>${table(['Policy','Period','Insurer','Status',''],history.map(v=>[esc(v.id),`${esc(v.start||'Not recorded')} → ${esc(v.end)}`,esc(v.insurer),v.replacedBy?'Previous period':'Latest period',`<button class="link" onclick="detail('${v.id}')">View ↗</button>`]))}`)}
detail=function(id){const p=scoped().find(p=>p.id===id);if(!p)return;renewalDetails(id);const modalEl=document.querySelector('.modal');modalEl.insertAdjacentHTML('beforeend',`<div class="banner" style="margin-top:20px">Coverage: ${esc(p.start||'Start date not recorded')} → ${esc(p.end)}${p.replacedBy?'<br>Previous period · replaced by '+esc(p.replacedBy):p.renewsPolicyId?'<br>Current insurance period · renews '+esc(p.renewsPolicyId):''}${p.coverageGapDays?'<br>Coverage gap: '+p.coverageGapDays+' days before this period':''}</div><div class="actions"><button class="btn" onclick="policyHistory('${p.id}')">Insurance history</button>${!p.replacedBy&&role!=='Agent'?`<button class="btn primary" onclick="renewalUpload('${p.id}')">Upload renewal</button>`:''}</div>`)};
rowsHTML=function(){if(page==='Vehicles')return table(['Registration','Make / model','Customer','Current period','Insurer',''],scoped().filter(p=>!p.replacedBy&&Object.values(p).join(' ').toLowerCase().includes(query.toLowerCase())).map(p=>[`<b>${esc(p.plate)}</b>`,esc(p.car),esc(p.name),`${esc(p.start||'Not recorded')} → ${esc(p.end)}`,esc(p.insurer),`<button class="link" onclick="detail('${p.id}')">View policy ↗</button><button class="link" onclick="policyHistory('${p.id}')">History</button>`]));let result=renewalPageRows();if(page==='Renewals'&&role!=='Agent')result=result.replace(/onclick="detail\('([^']+)'\)"[^>]*>View policy ↗<\/button>/g,(match,id)=>match+`<button class="link" onclick="renewalUpload('${id}')">Upload renewal</button>`);return result};
render=function(){renewalPageRender();if(page==='Policies'){const top=document.querySelector('.table-top');top.insertAdjacentHTML('beforeend',`<button class="btn" onclick="togglePolicyHistory()">${showPolicyHistory?'Show current policies':'Include policy history'}</button>`);document.querySelector('.table-top .card-note').textContent=showPolicyHistory?'All insurance periods · previous policies retained':'Latest insurance period for each vehicle';document.querySelector('.heading .sub').textContent='Upload renewal → replace the current period → retain policy history';if(role!=='Agent'){const b=document.querySelector('.heading .actions .primary');if(b)b.textContent='＋ New / renewed policy'}}};
render();

</script></body></html>
